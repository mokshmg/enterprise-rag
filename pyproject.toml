[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Moksh Grover", email = "mokshmg@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "pre-commit>=4.7.0",
    "pydantic-settings>=2.16.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "uvicorn[standard]>=0.54.0",
]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
] # errors, pyflakes, import sorting, bugbear, pyupgrade

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
